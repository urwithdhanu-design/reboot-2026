server.port=${PORT:8080}
gcul.runtime.mode=cloud
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.enabled=false
gcul.cloud-sql.enabled=${GCUL_CLOUD_SQL_ENABLED:false}
gcul.cloud-sql.instance=${GCUL_CLOUD_SQL_INSTANCE:}
gcul.cloud-sql.jdbc-url=jdbc:postgresql:///${GCUL_DB_NAME:gcul_wallet}
gcul.cloud-sql.username=${GCUL_DB_USER:gcul_app}
gcul.cloud-sql.password=${GCUL_DB_PASSWORD:}
gcul.cloud-sql.driver=org.postgresql.Driver
gcul.h2.url=jdbc:h2:file:/tmp/gcul/wallet-db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
gcul.h2.username=sa
gcul.h2.password=
gcul.h2.driver=org.h2.Driver
gcul.kyc-service.url=${GCUL_KYC_SERVICE_URL:http://127.0.0.1:8081}

gcul.app.web-base-url=${WEB_BASE_URL:https://insure360-83a36.web.app}
gcul.wallet-consent.expiry-hours=48

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USER:}
spring.mail.password=${EMAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

gcul.mail.enabled=${EMAIL_ENABLED:true}
gcul.mail.from-name=${EMAIL_FROM_NAME:Reboot 2026 Insurance}
gcul.mail.from-address=${EMAIL_USER:}
