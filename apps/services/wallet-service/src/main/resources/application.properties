# Wallet Service
server.port=${PORT:8089}
spring.application.name=wallet-service
gcul.runtime.mode=local
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

gcul.cloud-sql.enabled=false
gcul.h2.url=jdbc:h2:file:./data/wallet-db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
gcul.h2.username=sa
gcul.h2.password=
gcul.h2.driver=org.h2.Driver
gcul.cloud-sql.jdbc-url=jdbc:postgresql:///gcul_wallet
gcul.cloud-sql.username=gcul_app
gcul.cloud-sql.password=
gcul.cloud-sql.driver=org.postgresql.Driver
gcul.cloud-sql.instance=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

gcul.jwt.secret=gcul-dev-jwt-secret-change-me-32chars-min
gcul.jwt.expiration-ms=604800000

gcul.kyc-service.url=${GCUL_KYC_SERVICE_URL:http://127.0.0.1:8081}

gcul.pubsub.enabled=${GCUL_PUBSUB_ENABLED:false}
gcul.pubsub.project-id=${GCUL_PUBSUB_PROJECT:}
gcul.pubsub.topic-prefix=${GCUL_PUBSUB_TOPIC_PREFIX:gcul}
gcul.pubsub.service-id=gcul-wallet

gcul.app.web-base-url=${WEB_BASE_URL:http://localhost:5173}
gcul.wallet-consent.expiry-hours=48

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USER:}
spring.mail.password=${EMAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

gcul.mail.enabled=${EMAIL_ENABLED:true}
gcul.mail.from-name=${EMAIL_FROM_NAME:Reboot 2026 Insurance}
gcul.mail.from-address=${EMAIL_USER:}
