# Audit Service (Pub/Sub consumer + local event bus)
server.port=${PORT:8092}
spring.application.name=audit-service
gcul.runtime.mode=local

gcul.jwt.secret=${GCUL_JWT_SECRET:gcul-dev-jwt-secret-change-me-32chars-min}

spring.datasource.url=${GCUL_AUDIT_DB_URL:jdbc:h2:file:./data/audit-db;MODE=PostgreSQL;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${GCUL_AUDIT_DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

gcul.pubsub.enabled=${GCUL_PUBSUB_ENABLED:false}
gcul.pubsub.project-id=${GCUL_PUBSUB_PROJECT:}
gcul.pubsub.topic-prefix=${GCUL_PUBSUB_TOPIC_PREFIX:gcul}
gcul.pubsub.service-id=gcul-audit
