services:
  canton-sandbox:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: gcul-canton-sandbox
    ports:
      - "6865:6865"
      - "7575:7575"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:7575/v1/parties --header='Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJodHRwczovL2RhbWwuY29tL2xlZGdlci1hcGkiOnsibGVkZ2VySWQiOiJzYW5kYm94IiwiYXBwbGljYXRpb25JZCI6ImdjdWwtb3JjaGVzdHJhdG9yIiwiYWRtaW4iOnRydWUsImFjdEFzIjpbXSwicmVhZEFzIjpbXX0sImV4cCI6NDEwMjQ0NDgwMH0.' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped
